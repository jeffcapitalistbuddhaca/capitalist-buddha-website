[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."

[dev]
  functions = "netlify/functions"
  port = 3000

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  environment = { STRIPE_SECRET_KEY = "", GMAIL_USER = "", GMAIL_PASSWORD = "" }

[context.deploy-preview]
  environment = { STRIPE_SECRET_KEY = "", GMAIL_USER = "", GMAIL_PASSWORD = "" }
