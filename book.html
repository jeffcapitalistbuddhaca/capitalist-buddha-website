<script>
(function () {
  var BUY = "https://buy.stripe.com/dRm28s1wGcJX9pJ8j99Zm01";
  var title = document.getElementById("bk-title"), body = document.getElementById("bk-body");
  var id = new URLSearchParams(location.search).get("session_id");
  function esc(s) { return String(s || "").replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function noPurchase() {
    title.textContent = "Work with me one-on-one";
    body.innerHTML = '<p>One-on-one sessions with Dr. Jeffrey Overall are one hour each. After paying, you choose your time here.</p><p style="text-align:center"><a class="go" href="' + BUY + '">Work with me one-on-one</a></p>';
  }
  function calendly() {
    if (document.getElementById("cal-js")) return;
    var sc = document.createElement("script"); sc.id = "cal-js"; sc.async = true;
    sc.src = "https://assets.calendly.com/assets/external/widget.js"; document.body.appendChild(sc);
  }
  function show(d) {
    var pre = function (u) { return u + "?name=" + encodeURIComponent(d.name || "") + "&email=" + encodeURIComponent(d.email || "") + "&hide_gdpr_banner=1"; };
    title.textContent = "Thank you. Book your session" + (d.qty > 1 ? "s." : ".");
    var h = "<p>Your purchase includes " + d.qty + " session" + (d.qty > 1 ? "s" : "") + " of one hour. ";
    if (d.qty > 1) {
      h += "Below is one personal booking link for each session. Each link books one session and works only once.</p><ul class=\"bk-list\">";
      d.links.forEach(function (u, i) { h += '<li><a class="go" href="' + esc(pre(u)) + '" target="_blank" rel="noopener">Book session ' + (i + 1) + "</a></li>"; });
      h += "</ul>";
    } else {
      h += "Choose your time below. This personal booking link works only once.</p>" +
        '<div class="calendly-inline-widget" data-url="' + esc(pre(d.links[0])) + '"></div>';
      calendly();
    }
    h += '<p class="fine">We have also emailed these links to ' + esc(d.email) + ".</p>";
    body.innerHTML = h;
  }
  function load(tries) {
    fetch("/api/book?session_id=" + encodeURIComponent(id)).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok && x.d.links && x.d.links.length) return show(x.d);
        if (x.ok && x.d.pending && tries < 10) return setTimeout(function () { load(tries + 1); }, 2000);
        if (!x.ok && x.d.error === "not_found") return noPurchase();
        title.textContent = "Something went wrong";
        body.innerHTML = "<p>We could not load your booking links. Please refresh this page in a minute. If it keeps happening, contact us at jeff@capitalistbuddha.ca.</p>";
      })
      .catch(function () { title.textContent = "Something went wrong"; body.innerHTML = "<p>Please refresh this page.</p>"; });
  }
  if (!id) noPurchase(); else load(0);
})();
</script>
