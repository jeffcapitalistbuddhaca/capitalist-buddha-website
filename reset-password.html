<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Capitalist Buddha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .reset-container h2 {
            color: #9B7BA3;
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
        }
        .reset-container p {
            color: #666;
            margin: 0 0 1.5rem 0;
        }
        .reset-container label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .reset-container input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        .reset-container input:focus {
            outline: none;
            border-color: #9B7BA3;
            box-shadow: 0 0 0 2px rgba(155, 123, 163, 0.1);
        }
        .reset-container button {
            width: 100%;
            padding: 1rem;
            background: #9B7BA3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        #reset-message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
        }
        .success {
            color: #27ae60;
            background: #d4edda;
        }
        .error {
            color: #e74c3c;
            background: #fadbd8;
        }
        .reset-container a {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #9B7BA3;
            text-decoration: none;
        }
        .reset-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img src="images/botanical-left.png" alt="Botanical" class="botanical-left-top">
    <img src="images/botanical-left-bottom.png" alt="Botanical" class="botanical-left-bottom">
    <img src="images/botanical-right-1.png" alt="Botanical" class="botanical-right-1">
    <img src="images/botanical-right-2.png" alt="Botanical" class="botanical-right-2">

    <div class="reset-container">
        <h2>Reset your password</h2>
        <p>Enter the email you use for the course. We'll send you a link to choose a new password.</p>

        <form id="reset-form">
            <label for="reset-email">Email</label>
            <input id="reset-email" name="email" type="email" autocomplete="username" required>
            <button type="submit">Send reset link</button>
        </form>

        <p id="reset-message"></p>

        <p><a href="/?tab=login">Back to login</a></p>
    </div>

    <script type="module">
        import { auth } from "./js/firebase-init.js";
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const form = document.getElementById("reset-form");
        const message = document.getElementById("reset-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.getElementById("reset-email").value.trim();

            try {
                await sendPasswordResetEmail(auth, email);
            } catch (err) {
                console.error("Reset error:", err.code, err.message);
            }

            message.textContent =
                "If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.";
        });
    </script>
</body>
</html>
