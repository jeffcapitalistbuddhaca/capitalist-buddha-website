<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Capitalist Buddha</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .reset-header h1 {
            color: #9B7BA3;
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #9B7BA3;
            box-shadow: 0 0 0 2px rgba(155, 123, 163, 0.1);
        }
        .reset-button {
            width: 100%;
            padding: 1rem;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
        }
        .reset-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
        }
        .success {
            color: #27ae60;
            background: #d4edda;
        }
        .error {
            color: #e74c3c;
            background: #fadbd8;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #9B7BA3;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img src="images/botanical-left.png" alt="Botanical" class="botanical-left-top">
    <img src="images/botanical-left-bottom.png" alt="Botanical" class="botanical-left-bottom">
    <img src="images/botanical-right-1.png" alt="Botanical" class="botanical-right-1">
    <img src="images/botanical-right-2.png" alt="Botanical" class="botanical-right-2">

    <div class="reset-container">
        <div class="reset-header">
            <h1>Reset Your Password</h1>
            <p>Enter your email address to receive a password reset link</p>
        </div>

        <form id="reset-form">
            <div class="form-group">
                <label for="reset-email">Email</label>
                <input id="reset-email" name="email" type="email" autocomplete="username" required placeholder="Enter your email">
            </div>
            <button type="submit" class="reset-button">Send Reset Link</button>
        </form>

        <div id="reset-message"></div>

        <div class="back-link">
            <a href="/?tab=login">Back to Login</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6g8nBhHX2SVGB5kMRnZwhomNI7gonsuc",
            authDomain: "conscious-business-course.firebaseapp.com",
            projectId: "conscious-business-course",
            storageBucket: "conscious-business-course.appspot.com",
            messagingSenderId: "595221778299",
            appId: "1:595221778299:web:8e17e8f8d70b37b8d17e73"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById("reset-form");
        const message = document.getElementById("reset-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.getElementById("reset-email").value.trim();

            try {
                await sendPasswordResetEmail(auth, email);
                message.className = "message success";
                message.textContent = "If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.";
                form.reset();
            } catch (err) {
                console.error(err);
                message.className = "message error";
                message.textContent = "If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.";
            }
        });
    </script>
</body>
</html>
