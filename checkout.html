<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Capitalist Buddha</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .checkout-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .checkout-header h1 {
            color: #9B7BA3;
            margin: 0 0 0.5rem 0;
        }
        .checkout-header p {
            color: #666;
            margin: 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #9B7BA3;
            box-shadow: 0 0 0 2px rgba(155, 123, 163, 0.1);
        }
        #payment-element-container {
            margin: 2rem 0;
        }
        .pay-button {
            width: 100%;
            padding: 1rem;
            background: #9B7BA3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
        }
        .pay-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            margin: 1rem 0;
            padding: 1rem;
            background: #fadbd8;
            border-radius: 4px;
        }
        .success {
            color: #27ae60;
            margin: 1rem 0;
            padding: 1rem;
            background: #d5f4e6;
            border-radius: 4px;
        }
        .section-label {
            font-weight: 600;
            color: #9B7BA3;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <img src="images/botanical-left.png" alt="Botanical" class="botanical-left-top">
    <img src="images/botanical-left-bottom.png" alt="Botanical" class="botanical-left-bottom">
    <img src="images/botanical-right-1.png" alt="Botanical" class="botanical-right-1">
    <img src="images/botanical-right-2.png" alt="Botanical" class="botanical-right-2">

    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Complete Payment</h1>
            <p>Capitalist Buddha Course</p>
            <p style="font-weight: bold; font-size: 1.2rem; margin-top: 0.5rem;">$199 USD</p>
        </div>

        <div id="error-message" class="error" style="display: none;"></div>
        <div id="success-message" class="success" style="display: none;"></div>

        <form id="payment-form">
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="section-label">Payment Information</div>
            <div id="payment-element-container"></div>

            <button type="submit" class="pay-button" id="submit-button">Pay $199</button>
        </form>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const STRIPE_PUBLISHABLE = 'pk_test_51UVYmmKLvdoBDUk6kEmkKFKv5znaZoWM4WXBB4kyGInGQoj4aYgeUsOYEXqgApfbWF7W9KizCqgEZxKKfNM34tZF00TJ1Mtwve';
        const COURSE_PRICE = 199;
        const WORKER_URL = 'https://capitalistbuddha.ca';

        let stripe = null;
        let paymentElement = null;

        stripe = Stripe(STRIPE_PUBLISHABLE);

        const form = document.getElementById('payment-form');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;

            if (!email) {
                errorDiv.textContent = 'Please enter your email address';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                // Create payment intent
                const response = await fetch(`${WORKER_URL}/api/create-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                if (!data.clientSecret) throw new Error('Failed to create payment');

                // Create Payment Element with clientSecret
                if (!paymentElement) {
                    const elements = stripe.elements({
                        clientSecret: data.clientSecret
                    });
                    paymentElement = elements.create('payment');
                    paymentElement.mount('#payment-element-container');
                }

                // Confirm payment
                const { error, paymentIntent } = await stripe.confirmPayment({
                    elements: stripe.elements({clientSecret: data.clientSecret}),
                    clientSecret: data.clientSecret,
                    confirmParams: {
                        return_url: window.location.origin + '/?payment=success'
                    },
                    redirect: 'if_required'
                });

                if (error) {
                    errorDiv.textContent = `Payment failed: ${error.message}`;
                    errorDiv.style.display = 'block';
                } else if (paymentIntent && paymentIntent.status === 'succeeded') {
                    successDiv.textContent = 'Payment Complete! Creating your account...';
                    successDiv.style.display = 'block';
                    errorDiv.style.display = 'none';
                    form.style.display = 'none';

                    const password = prompt('Create a password for your account:');
                    if (!password) {
                        errorDiv.textContent = 'Password creation cancelled';
                        errorDiv.style.display = 'block';
                        successDiv.style.display = 'none';
                        form.style.display = 'block';
                        return;
                    }

                    const confirmResponse = await fetch(`${WORKER_URL}/api/confirm-payment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            paymentIntentId: paymentIntent.id,
                            email,
                            password
                        })
                    });

                    const confirmData = await confirmResponse.json();
                    if (confirmData.success) {
                        window.location.href = `/?tab=login&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;
                    } else {
                        throw new Error('Failed to create account');
                    }
                }
            } catch (error) {
                console.error('Payment error:', error);
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
