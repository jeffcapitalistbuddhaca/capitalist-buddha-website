<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Capitalist Buddha</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .checkout-container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .checkout-header h1 {
            color: #9B7BA3;
            margin: 0 0 0.5rem 0;
        }
        .checkout-header p {
            color: #666;
            margin: 0;
        }
        #checkout {
            min-height: 600px;
        }
    </style>
</head>
<body>
    <img src="images/botanical-left.png" alt="Botanical" class="botanical-left-top">
    <img src="images/botanical-left-bottom.png" alt="Botanical" class="botanical-left-bottom">
    <img src="images/botanical-right-1.png" alt="Botanical" class="botanical-right-1">
    <img src="images/botanical-right-2.png" alt="Botanical" class="botanical-right-2">

    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Complete Payment</h1>
            <p>Capitalist Buddha Course - $199 USD</p>
        </div>

        <div id="checkout"></div>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const STRIPE_PUBLISHABLE = 'pk_test_51UVYmmKLvdoBDUk6kEmkKFKv5znaZoWM4WXBB4kyGInGQoj4aYgeUsOYEXqgApfbWF7W9KizCqgEZxKKfNM34tZF00TJ1Mtwve';
        const WORKER_URL = 'https://capitalistbuddha.ca';

        const stripe = Stripe(STRIPE_PUBLISHABLE);

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('Fetching checkout session...');

                // Fetch clientSecret from server
                const response = await fetch(`${WORKER_URL}/api/create-checkout-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'user@example.com' })
                });

                const data = await response.json();
                console.log('Checkout session response:', data);

                if (!data.clientSecret) {
                    throw new Error('Failed to create checkout session');
                }

                // Initialize embedded checkout page with the client secret
                console.log('Creating embedded checkout page...');
                const checkout = await stripe.createEmbeddedCheckoutPage({
                    clientSecret: data.clientSecret,
                });

                console.log('Mounting checkout...');
                // Mount the checkout
                checkout.mount('#checkout');
                console.log('Checkout mounted successfully');

            } catch (err) {
                console.error('Checkout error:', err);
                document.getElementById('checkout').innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
