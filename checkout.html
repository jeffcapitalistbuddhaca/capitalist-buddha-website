<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Capitalist Buddha</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .checkout-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .checkout-header h1 {
            color: #9B7BA3;
            margin: 0 0 0.5rem 0;
        }
        .checkout-header p {
            color: #666;
            margin: 0;
        }
        .price-breakdown {
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
        .price-row {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }
        .price-total {
            font-size: 1.5rem;
            color: #9B7BA3;
            border-top: 2px solid #9B7BA3;
            padding-top: 0.5rem;
            margin-top: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #9B7BA3;
            box-shadow: 0 0 0 2px rgba(155, 123, 163, 0.1);
        }
        .pay-button {
            width: 100%;
            padding: 1rem;
            background: #9B7BA3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
        }
        .pay-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            margin: 1rem 0;
            padding: 1rem;
            background: #fadbd8;
            border-radius: 4px;
        }
        #address-element {
            margin: 1.5rem 0;
        }
        #payment-element {
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
    <img src="images/botanical-left.png" alt="Botanical" class="botanical-left-top">
    <img src="images/botanical-left-bottom.png" alt="Botanical" class="botanical-left-bottom">
    <img src="images/botanical-right-1.png" alt="Botanical" class="botanical-right-1">
    <img src="images/botanical-right-2.png" alt="Botanical" class="botanical-right-2">

    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Complete Payment</h1>
            <p>Capitalist Buddha Course</p>
            <div class="price-breakdown">
                <div class="price-row">
                    <span>Subtotal:</span>
                    <span>$199.00</span>
                </div>
                <div class="price-row">
                    <span>Tax:</span>
                    <span id="tax-display">$0.00</span>
                </div>
                <div class="price-total">
                    <div class="price-row">
                        <span>Total:</span>
                        <span id="total-display">$199.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="error-message" class="error" style="display: none;"></div>

        <form id="payment-form">
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div id="address-element"></div>
            <div id="payment-element"></div>

            <button type="submit" class="pay-button" id="submit-button">Pay <span id="amount-display">$199.00</span></button>
        </form>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const STRIPE_PUBLISHABLE = 'pk_test_51UVYmmKLvdoBDUk6kEmkKFKv5znaZoWM4WXBB4kyGInGQoj4aYgeUsOYEXqgApfbWF7W9KizCqgEZxKKfNM34tZF00TJ1Mtwve';
        const WORKER_URL = 'https://capitalistbuddha.ca';

        let stripe = Stripe(STRIPE_PUBLISHABLE);
        let elements = null;
        let addressElement = null;
        let paymentElement = null;
        let currentClientSecret = null;
        let currentPaymentIntentId = null;

        const form = document.getElementById('payment-form');
        const errorDiv = document.getElementById('error-message');

        // Initialize Stripe elements when page loads
        async function initElements(clientSecret) {
            // Create elements with the PaymentIntent's client secret
            elements = stripe.elements({
                clientSecret: clientSecret
            });

            // Create and mount Address Element
            addressElement = elements.create('address', {
                mode: 'billing'
            });
            addressElement.mount('#address-element');

            // Create and mount Payment Element
            paymentElement = elements.create('payment', {
                layout: 'tabs'
            });
            paymentElement.mount('#payment-element');

            // Listen for address changes to calculate and update tax in real-time
            addressElement.addEventListener('change', async (event) => {
                const { value: address } = event;
                if (!address || !address.line1) return;

                try {
                    // Calculate tax for this address
                    const taxRes = await fetch(`${WORKER_URL}/api/calculate-tax`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address })
                    });

                    const taxData = await taxRes.json();
                    if (taxData.success && currentPaymentIntentId) {
                        // Update the PaymentIntent with the new amount (base + tax)
                        const finalAmount = 19900 + (taxData.taxAmount || 0);

                        const updateRes = await fetch(`${WORKER_URL}/api/update-payment`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                paymentIntentId: currentPaymentIntentId,
                                amount: finalAmount
                            })
                        });

                        const updateData = await updateRes.json();
                        if (updateData.success) {
                            // Update display with new tax and total
                            const taxUsd = (taxData.taxAmount / 100).toFixed(2);
                            const totalUsd = (finalAmount / 100).toFixed(2);

                            document.getElementById('tax-display').textContent = `$${taxUsd}`;
                            document.getElementById('total-display').textContent = `$${totalUsd}`;
                            document.getElementById('amount-display').textContent = `$${totalUsd}`;
                        }
                    }
                } catch (err) {
                    console.error('Tax calculation error:', err);
                }
            });
        }

        // On page load, create PaymentIntent and initialize elements
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${WORKER_URL}/api/create-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'checkout@temp.com' })
                });

                const data = await res.json();
                if (!data.clientSecret) throw new Error('Failed to create payment intent');

                currentClientSecret = data.clientSecret;
                currentPaymentIntentId = data.paymentIntentId;

                await initElements(currentClientSecret);
            } catch (err) {
                errorDiv.textContent = `Initialization error: ${err.message}`;
                errorDiv.style.display = 'block';
            }
        });

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            // Validate email
            const email = document.getElementById('email').value.trim();
            if (!email) {
                errorDiv.textContent = 'Please enter your email';
                errorDiv.style.display = 'block';
                return;
            }

            // Validate address was entered
            const { value: address } = await addressElement.getValue();
            if (!address || !address.line1) {
                errorDiv.textContent = 'Please enter your complete address';
                errorDiv.style.display = 'block';
                return;
            }

            // Call elements.submit() to collect all form data (Stripe requirement)
            const { error: submitError } = await elements.submit();
            if (submitError) {
                errorDiv.textContent = submitError.message;
                errorDiv.style.display = 'block';
                return;
            }

            // Confirm payment with the PaymentIntent that now has the correct amount
            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: window.location.origin + '/?payment_success'
                }
            });

            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
