<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmed - Capitalist Buddha</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .confirmation-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .confirmation-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .confirmation-header h1 {
            color: #27ae60;
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }
        .confirmation-details {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            border-left: 4px solid #9B7BA3;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            color: #666;
            font-weight: 500;
        }
        .detail-value {
            color: #333;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #9B7BA3;
            box-shadow: 0 0 0 2px rgba(155, 123, 163, 0.1);
        }
        .section-label {
            font-weight: 600;
            color: #9B7BA3;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0.5rem;
        }
        .confirm-button {
            width: 100%;
            padding: 1rem;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
        }
        .confirm-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            margin: 1rem 0;
            padding: 1rem;
            background: #fadbd8;
            border-radius: 4px;
        }
        .success {
            color: #27ae60;
            margin: 1rem 0;
            padding: 1rem;
            background: #d4edda;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <img src="images/botanical-left.png" alt="Botanical" class="botanical-left-top">
    <img src="images/botanical-left-bottom.png" alt="Botanical" class="botanical-left-bottom">
    <img src="images/botanical-right-1.png" alt="Botanical" class="botanical-right-1">
    <img src="images/botanical-right-2.png" alt="Botanical" class="botanical-right-2">

    <div class="confirmation-container">
        <div class="confirmation-header">
            <h1>✓ Payment Confirmed</h1>
            <p>Welcome to Capitalist Buddha</p>
        </div>

        <div class="confirmation-details">
            <div class="detail-row">
                <span class="detail-label">Course:</span>
                <span class="detail-value">Conscious Business Course</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount Paid:</span>
                <span class="detail-value">$199.00 USD</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Access Duration:</span>
                <span class="detail-value">6 Months</span>
            </div>
        </div>

        <div id="error-message" class="error" style="display: none;"></div>
        <div id="success-message" class="success" style="display: none;"></div>

        <form id="account-form" novalidate>
            <div class="section-label">Create Your Account</div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="username" readonly>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required placeholder="Create a secure password" autocomplete="new-password" minlength="8">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password *</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password" autocomplete="new-password">
            </div>

            <button type="submit" id="create-button" class="confirm-button">Complete Setup & Access Course</button>
        </form>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script type="module">
        import { auth } from "./js/firebase-init.js";
        import {
            createUserWithEmailAndPassword,
            sendEmailVerification,
        } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const errorDiv = document.getElementById("error-message");
        const successDiv = document.getElementById("success-message");
        const form = document.getElementById("account-form");
        const emailInput = document.getElementById("email");
        const createButton = document.getElementById("create-button");

        function showError(text) {
            errorDiv.textContent = text;
            errorDiv.style.display = "block";
        }

        // 1. Find out which email paid, straight from Stripe (via our session-status endpoint).
        const sessionId = new URLSearchParams(window.location.search).get("session_id");
        if (!sessionId) {
            showError("Invalid confirmation link. Please contact us.");
        } else {
            try {
                const response = await fetch(`/api/session-status?session_id=${encodeURIComponent(sessionId)}`);
                const data = await response.json();
                if (data.status === "complete" && data.customer_email) {
                    emailInput.value = data.customer_email;
                    form.style.display = "block";
                } else {
                    showError("We couldn't confirm this payment. Please contact us.");
                }
            } catch (err) {
                console.error("Session status error:", err);
                showError("We couldn't confirm this payment. Please refresh the page or contact us.");
            }
        }

        // 2. Create the Firebase account and send the verification email.
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorDiv.style.display = "none";
            const email = emailInput.value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (!email || !password || !confirmPassword) {
                showError("Please fill in all fields.");
                return;
            }

            if (!email.includes("@")) {
                showError("Please enter a valid email address.");
                return;
            }

            if (password.length < 8) {
                showError("Please use at least 8 characters for your password.");
                return;
            }

            if (password !== confirmPassword) {
                showError("Passwords do not match.");
                return;
            }

            createButton.disabled = true;
            try {
                const { user } = await createUserWithEmailAndPassword(auth, email, password);
                await sendEmailVerification(user);
                form.style.display = "none";
                successDiv.innerHTML =
                    "Your account is ready. We sent a verification email to <strong></strong>. " +
                    "Click the link in that email, then " +
                    '<a href="/?tab=login">go to the course</a>.';
                successDiv.querySelector("strong").textContent = email;
                successDiv.style.display = "block";
            } catch (err) {
                console.error("Account creation error:", err.code, err.message);
                if (err.code === "auth/email-already-in-use") {
                    showError('An account already exists for this email. Please log in, or use "Forgot password?" on the login page.');
                } else if (err.code === "auth/weak-password") {
                    showError("That password is too weak. Please choose a longer one.");
                } else {
                    showError("Something went wrong creating your account. Please try again or contact us.");
                }
                createButton.disabled = false;
            }
        });
    </script>
</body>
</html>
