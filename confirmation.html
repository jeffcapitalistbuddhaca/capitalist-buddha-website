<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmed - Capitalist Buddha</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .confirmation-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .confirmation-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .confirmation-header h1 {
            color: #27ae60;
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }
        .confirmation-details {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            border-left: 4px solid #9B7BA3;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            color: #666;
            font-weight: 500;
        }
        .detail-value {
            color: #333;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #9B7BA3;
            box-shadow: 0 0 0 2px rgba(155, 123, 163, 0.1);
        }
        .section-label {
            font-weight: 600;
            color: #9B7BA3;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0.5rem;
        }
        .confirm-button {
            width: 100%;
            padding: 1rem;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
        }
        .confirm-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            margin: 1rem 0;
            padding: 1rem;
            background: #fadbd8;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <img src="images/botanical-left.png" alt="Botanical" class="botanical-left-top">
    <img src="images/botanical-left-bottom.png" alt="Botanical" class="botanical-left-bottom">
    <img src="images/botanical-right-1.png" alt="Botanical" class="botanical-right-1">
    <img src="images/botanical-right-2.png" alt="Botanical" class="botanical-right-2">

    <div class="confirmation-container">
        <div class="confirmation-header">
            <h1>✓ Payment Confirmed</h1>
            <p>Welcome to Capitalist Buddha</p>
        </div>

        <div class="confirmation-details">
            <div class="detail-row">
                <span class="detail-label">Course:</span>
                <span class="detail-value">Conscious Business Course</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount Paid:</span>
                <span class="detail-value">$199.00 USD</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Access Duration:</span>
                <span class="detail-value">6 Months</span>
            </div>
        </div>

        <div id="error-message" class="error" style="display: none;"></div>

        <form id="account-form" novalidate>
            <div class="section-label">Create Your Account</div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required placeholder="Create a secure password">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password *</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password">
            </div>

            <button type="submit" class="confirm-button">Complete Setup & Access Course</button>
        </form>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const STRIPE_PUBLISHABLE = 'pk_test_51UVYmmKLvdoBDUk6kEmkKFKv5znaZoWM4WXBB4kyGInGQoj4aYgeUsOYEXqgApfbWF7W9KizCqgEZxKKfNM34tZF00TJ1Mtwve';
        const WORKER_URL = 'https://capitalistbuddha.ca';

        let stripe = Stripe(STRIPE_PUBLISHABLE);

        document.addEventListener('DOMContentLoaded', () => {
            const errorDiv = document.getElementById('error-message');
            const form = document.getElementById('account-form');
            const emailInput = document.getElementById('email');

            if (!errorDiv || !form) {
                console.error('Required DOM elements not found');
                return;
            }

            // Get session_id or clientSecret from URL
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('session_id');
            const clientSecret = params.get('payment_intent_client_secret');
            const prefillEmail = params.get('email');

            // Prefill email if provided
            if (prefillEmail && emailInput) {
                emailInput.value = decodeURIComponent(prefillEmail);
            }

            // Payment verification depends on flow type
            if (!sessionId && !clientSecret) {
                errorDiv.textContent = 'Invalid confirmation link. Please contact support.';
                errorDiv.style.display = 'block';
                form.style.display = 'none';
                return;
            }

            // For Checkout Session flow: payment is already verified by session status
            if (sessionId) {
                console.log('Checkout Session payment confirmed, ready for account creation');
            }

            // For Payment Intent flow (legacy): verify with Stripe
            if (clientSecret) {
                try {
                    stripe.retrievePaymentIntent(clientSecret).then(({paymentIntent}) => {
                        if (paymentIntent.status !== 'succeeded') {
                            errorDiv.textContent = `Payment failed with status: ${paymentIntent.status}`;
                            errorDiv.style.display = 'block';
                            form.style.display = 'none';
                        }
                    }).catch(err => {
                        errorDiv.textContent = `Error verifying payment: ${err.message}`;
                        errorDiv.style.display = 'block';
                        form.style.display = 'none';
                    });
                } catch (err) {
                    errorDiv.textContent = `Error: ${err.message}`;
                    errorDiv.style.display = 'block';
                    form.style.display = 'none';
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                // Validate all fields are filled
                if (!email || !password || !confirmPassword) {
                    errorDiv.textContent = 'Please fill in all fields';
                    errorDiv.style.display = 'block';
                    return;
                }

                // Validate passwords match
                if (password !== confirmPassword) {
                    errorDiv.textContent = 'Passwords do not match';
                    errorDiv.style.display = 'block';
                    return;
                }

                // Validate email format
                if (!email.includes('@')) {
                    errorDiv.textContent = 'Please enter a valid email address';
                    errorDiv.style.display = 'block';
                    return;
                }

                try {
                    let paymentId = null;

                    // Get payment ID based on flow type
                    if (sessionId) {
                        // For Checkout Session: use sessionId
                        paymentId = sessionId;
                    } else if (clientSecret) {
                        // For Payment Intent: retrieve from Stripe
                        const {paymentIntent} = await stripe.retrievePaymentIntent(clientSecret);
                        paymentId = paymentIntent.id;
                    }

                    if (!paymentId) {
                        throw new Error('Payment ID not found');
                    }

                    // Create enrollment
                    const response = await fetch(`${WORKER_URL}/api/confirm-payment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            paymentIntentId: paymentId,
                            email,
                            password
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Clear any previous user session and redirect to login
                        localStorage.removeItem('currentUser');
                        window.location.href = `/?tab=login&email=${encodeURIComponent(email)}`;
                    } else {
                        throw new Error(data.error || 'Failed to create account');
                    }
                } catch (error) {
                    errorDiv.textContent = `Error: ${error.message}`;
                    errorDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
